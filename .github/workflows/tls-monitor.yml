name: TLS monitor offline checks
on:
  push:
    branches: [main]
    paths: ["ops/public-ip-https/**", ".github/workflows/tls-monitor.yml"]
  pull_request:
    paths: ["ops/public-ip-https/**", ".github/workflows/tls-monitor.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.6", "3.12"]
    container: python:${{ matrix.python }}-slim
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s ops/public-ip-https/tests -p 'test_*.py' -v
