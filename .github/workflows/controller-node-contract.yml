name: Controller Node contract
on:
  push:
    branches: [main]
    paths: ["controller-server/**", "node-agent/**", "tools/contracts/**", ".github/workflows/controller-node-contract.yml"]
  pull_request:
    paths: ["controller-server/**", "node-agent/**", "tools/contracts/**", ".github/workflows/controller-node-contract.yml"]
permissions:
  contents: read
env:
  TZ: Asia/Shanghai
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap hash-verified pip CA fix
        run: python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: pip install -r controller-server/requirements-dev.txt -r node-agent/requirements-dev.txt
      - run: python -m pytest -q -c tools/contracts/pytest.ini tools/contracts
      - run: python -m pytest -q -c node-agent/pytest.ini node-agent/tests/test_admission_control.py
