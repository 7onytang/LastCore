name: macOS Packaging Fake Checks
on:
  push:
    branches: [main]
    paths: ["macos-client/scripts/**", "macos-client/README.md", ".github/workflows/macos-packaging.yml"]
  pull_request:
    paths: ["macos-client/scripts/**", "macos-client/README.md", ".github/workflows/macos-packaging.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fake-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # All subprocesses are fakes; no build, keys, Apple services or app launch.
      - name: Run synthetic packaging tests only
        run: python -m unittest discover -s macos-client/scripts -p 'test_build_dmg.py' -v
