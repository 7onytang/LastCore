name: Android native APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-native.yml']
  pull_request:
    paths: ['android-app/**', '.github/workflows/android-native.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      ANDROID_HOME: ${{ github.workspace }}/android-app/.toolchain/sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-app/.toolchain/sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pure owner-signing boundaries (no keys, signing or devices)
        run: python3 -m unittest discover -s android-app/tests-python -p 'test_*.py' -v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.13'
      - name: Provision pinned Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '13114758' # CLI19, same JDK17-compatible tools used locally
          accept-android-sdk-licenses: 'false'
          packages: ''
      - name: Install only approved SDK packages
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('android-app/SDK-APPROVAL.json').read_text())
          assert a['license_id']=='android-sdk-license'
          p=Path(os.environ['ANDROID_HOME'])/'licenses/android-sdk-license'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('\n'.join(a['sdkmanager_recorded_license_hashes'])+'\n')
          PY
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Real APK build and pure Java fail-closed checks
        shell: bash
        run: |
          set -o pipefail
          android-app/build-apk.sh 2>&1 | tee android-app/verification-build.log
      - name: Preserve actual failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-failure-${{ github.sha }}
          path: android-app/verification-build.log
          if-no-files-found: ignore
      - name: Check debug signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64-debug-and-unsigned-release-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk
            android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android-app/verification/artifact-manifest.json
            android-app/verification-build.log
          if-no-files-found: error
