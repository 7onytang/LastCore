name: Node Agent
on:
  push:
    branches: [main]
    paths: ["node-agent/**", ".github/workflows/node-agent.yml"]
  pull_request:
    paths: ["node-agent/**", ".github/workflows/node-agent.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  state-lock:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap hash-verified pip CA fix
        run: python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_credentials.py tests/test_settled_recovery.py tests/test_credential_recovery.py
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap hash-verified pip CA fix
        run: python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: pip install -r requirements-dev.txt
      - run: pip install numpy==2.5.4
      - run: pytest -q
