name: Distributed inference
on:
  push:
    branches: [main]
    paths:
      - "inference-engine/**"
      - "communication/**"
      - "node-agent/**"
      - "controller-server/**"
      - "integration/**"
      - "ops/staging/**"
      - "LICENSE"
      - ".github/workflows/distributed-inference.yml"
  pull_request:
    paths:
      - "inference-engine/**"
      - "communication/**"
      - "node-agent/**"
      - "controller-server/**"
      - "integration/**"
      - "ops/staging/**"
      - "LICENSE"
      - ".github/workflows/distributed-inference.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  communication:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: communication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap hash-verified pip CA fix
        run: python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  inference-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap hash-verified pip CA fix
        run: python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  two-node-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap hash-verified pip CA fix
        run: python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: pip install -r requirements-dev.txt
      - name: Two processes, one checkpoint, identical logits
        run: python examples/two_node_local.py
      - name: Three processes, one checkpoint, identical logits
        run: python examples/two_node_local.py --layers 0:1,1:3,3:4 --prompt "5 6 7"

  integrated-controller-two-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact module environments
        run: |
          python -m venv /tmp/lastcore-controller
          python -m venv /tmp/lastcore-node
          python -m venv /tmp/lastcore-engine
          /tmp/lastcore-controller/bin/python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          /tmp/lastcore-controller/bin/pip install -r controller-server/requirements-dev.txt
          /tmp/lastcore-node/bin/python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          /tmp/lastcore-node/bin/pip install -r node-agent/requirements-dev.txt -r inference-engine/requirements.txt
          /tmp/lastcore-engine/bin/python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          /tmp/lastcore-engine/bin/pip install -r inference-engine/requirements-dev.txt
      - name: Real local Controller and two tiny stage nodes
        env:
          CONTROLLER_PY: /tmp/lastcore-controller/bin/python
          NODE_PY: /tmp/lastcore-node/bin/python
          ENGINE_PY: /tmp/lastcore-engine/bin/python
          LC11_RUN_DIR: /tmp/lastcore-integrated-evidence
        run: bash integration/run_two_node_local.sh
      - name: Assert cleanup evidence
        if: always()
        run: |
          python -c 'import json; x=json.load(open("/tmp/lastcore-integrated-evidence/summary.json")); assert x["cleanup_ok"] and not x["still_alive"] and not x["ports_still_bound"] and x["all_commands_exit_ok"] and x["exit_code"] == 0'
      - name: Real backup and recovery with original node credentials
        run: /tmp/lastcore-controller/bin/python integration/verify_backup_recovery.py --run-dir /tmp/lastcore-integrated-evidence > /tmp/lastcore-integrated-evidence/recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-tiny-evidence
          path: /tmp/lastcore-integrated-evidence
  staging-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source archive and manifest binding
        run: python -m unittest discover -s ops/staging/tests -v
      - name: Validate and build fixed staging image
        env:
          CONTROLLER_ADMIN_TOKEN: ci-placeholder-admin-credentials-00000000
          CONTROLLER_REGISTRATION_TOKEN: ci-placeholder-registration-0000000000
        run: |
          export SOURCE_COMMIT="$GITHUB_SHA"
          docker compose -f ops/staging/compose.yaml config --quiet
          docker build --platform linux/amd64 --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f ops/staging/Dockerfile -t lastcore-staging-ci .
          test "$(docker image inspect lastcore-staging-ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
