name: Distributed inference
on:
  push:
    paths:
      - "inference-engine/**"
      - "communication/**"
      - ".github/workflows/distributed-inference.yml"
  pull_request:
    paths:
      - "inference-engine/**"
      - "communication/**"
      - ".github/workflows/distributed-inference.yml"
permissions:
  contents: read
jobs:
  communication:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: communication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  inference-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  two-node-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Two processes, one checkpoint, identical logits
        run: python examples/two_node_local.py
      - name: Three processes, one checkpoint, identical logits
        run: python examples/two_node_local.py --layers 0:1,1:3,3:4 --prompt "5 6 7"
