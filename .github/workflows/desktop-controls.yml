name: Desktop controls
on:
  push:
    branches: [main]
    paths: ["node-agent/**", "edge-client/**", "controller-server/app/ui/desktop.html", "controller-server/app/ui/console.js", "controller-server/tests-ui/desktop.test.cjs", ".github/workflows/desktop-controls.yml"]
  pull_request:
    paths: ["node-agent/**", "edge-client/**", "controller-server/app/ui/desktop.html", "controller-server/app/ui/console.js", "controller-server/tests-ui/desktop.test.cjs", ".github/workflows/desktop-controls.yml"]
  workflow_dispatch:
permissions:
  contents: read
env:
  TZ: Asia/Shanghai
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Bootstrap pip using official fixed wheel and SHA256
        run: >-
          python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir
          "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - name: Install declared unit test dependencies
        run: python -m pip install -r node-agent/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Production desktop state and controls with Fake process
        working-directory: node-agent
        run: python -m pytest -q tests/test_desktop_admission.py tests/test_local_status.py tests/test_resource_snapshot.py tests/test_desktop_ui.py -k "not local_controls_require"
      - name: Production portable Session and callbacks with Fake core
        working-directory: edge-client
        run: python -m pytest -q tests/test_gui_view.py tests/test_admission_view.py tests/test_runtime_binding_inputs.py tests/test_stop_isolation.py
      - name: Production desktop JS and HTML event bindings with in-process DOM
        run: node --test controller-server/tests-ui/desktop.test.cjs
