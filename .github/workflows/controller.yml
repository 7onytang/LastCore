name: Controller
on:
  push:
    branches: [main]
    paths: ["controller-server/**", ".github/workflows/controller.yml"]
  pull_request:
    paths: ["controller-server/**", ".github/workflows/controller.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap hash-verified pip CA fix
        run: python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --no-cache-dir "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Idle expiry HTTP smoke test
        run: python scripts/smoke_idle_expiry.py
      - name: Validate Compose configuration
        env:
          CONTROLLER_ADMIN_TOKEN: ci-admin-token-with-at-least-32-characters
          CONTROLLER_REGISTRATION_TOKEN: ci-registration-token-with-at-least-32-characters
        run: docker compose config --quiet
      - name: Container smoke test
        env:
          CONTROLLER_ADMIN_TOKEN: ci-admin-token-with-at-least-32-characters
          CONTROLLER_REGISTRATION_TOKEN: ci-registration-token-with-at-least-32-characters
        run: |
          docker compose up --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8000/healthz
          docker compose exec -T controller python -m app.backup --database /data/controller.sqlite3 --output /data/ci-backup.sqlite3
          docker compose exec -T controller python -c 'import sqlite3; db = sqlite3.connect("file:/data/ci-backup.sqlite3?mode=ro", uri=True); assert db.execute("PRAGMA integrity_check").fetchall() == [("ok",)]; assert db.execute("PRAGMA journal_mode").fetchone() == ("delete",); db.close()'
          if docker compose exec -T controller python -m app.backup --database /data/controller.sqlite3 --output /data/ci-backup.sqlite3; then
            echo "Backup unexpectedly overwrote existing output" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
      - name: Read-only database diagnostics in container
        env:
          CONTROLLER_ADMIN_TOKEN: ci-admin-token-with-at-least-32-characters
          CONTROLLER_REGISTRATION_TOKEN: ci-registration-token-with-at-least-32-characters
        run: docker compose exec -T controller python -m app.diagnostics --database /data/controller.sqlite3
      - name: Container logs and cleanup
        if: always()
        env:
          CONTROLLER_ADMIN_TOKEN: ci-admin-token-with-at-least-32-characters
          CONTROLLER_REGISTRATION_TOKEN: ci-registration-token-with-at-least-32-characters
        run: |
          docker compose logs
          docker compose down --volumes
