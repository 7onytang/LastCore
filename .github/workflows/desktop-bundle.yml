name: macOS client bundle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['node-agent/**', 'inference-engine/**', 'communication/**', 'controller-server/**', 'tools/client-ci/verify_desktop_binding.py', '.github/workflows/desktop-bundle.yml']
  pull_request:
    paths: ['node-agent/**', 'inference-engine/**', 'communication/**', 'controller-server/**', 'tools/client-ci/verify_desktop_binding.py', '.github/workflows/desktop-bundle.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check platform and clean source
        run: |
          test "$(uname -m)" = arm64
          git diff --exit-code HEAD
      - name: Build real bundle and verify shipped licenses
        run: BUNDLE_PYTHON=python node-agent/desktop/build_bundle.sh
      - name: Verify artifact hashes and frozen source code binding
        run: node-agent/.venv-build/bin/python tools/client-ci/verify_desktop_binding.py > node-agent/dist/source-binding.json
      - name: Install separate verification environment
        run: |
          python -m venv "$RUNNER_TEMP/client-verification"
          "$RUNNER_TEMP/client-verification/bin/pip" install -r controller-server/requirements-dev.txt -r node-agent/requirements.txt -r inference-engine/requirements.txt
      - name: Unit regression and real local tiny pipeline cancel/restart
        run: |
          "$RUNNER_TEMP/client-verification/bin/python" -m pytest -q node-agent/tests
          "$RUNNER_TEMP/client-verification/bin/python" node-agent/desktop/verify_stage_bundle.py > node-agent/dist/local-tiny-verification.json
      - name: Package unsigned artifact
        run: |
          tar -czf node-agent/dist/lastcore-node-agent-macos-arm64-unsigned.tar.gz -C node-agent/dist lastcore-node-agent lastcore-node-agent.manifest.json source-binding.json local-tiny-verification.json
          shasum -a 256 node-agent/dist/lastcore-node-agent-macos-arm64-unsigned.tar.gz > node-agent/dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-unsigned-${{ github.sha }}
          path: |
            node-agent/dist/lastcore-node-agent-macos-arm64-unsigned.tar.gz
            node-agent/dist/SHA256SUMS
          if-no-files-found: error
