plugins { id "com.android.application" }
android {
    namespace "ai.lastcore.android"
    compileSdk 35
    ndkVersion "28.2.13676358"
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
    defaultConfig { applicationId "ai.lastcore.android"; minSdk 29; targetSdk 35; versionCode 1; versionName "0.1.0-draft"; testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"; ndk { abiFilters "arm64-v8a" }; externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=Release" } } }
    sourceSets { main { assets.srcDir "build/generated/binding-assets" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
